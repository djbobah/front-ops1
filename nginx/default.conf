server {
    listen  80;
    listen  [::]:80;
    server_name _;  

    location /.well-known/acme-challenge {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name frontops-resault.ru;

    ssl_certificate /etc/letsencrypt/live/frontops-resault.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frontops-resault.ru/privkey.pem;

    location / {
        root /static;
        index  index.html index.htm;
    }
}