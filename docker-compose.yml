services:
  date:
    image: djbobah/result-date
    build:
      dockerfile: date.dockerfile
  result:
    image: djbobah/result
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      - date
  nginx:
    image: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./static:/static
      - ./sertbot/www:/var/www/certbot
      - ./certbot/data:/etc/letsencrypt
  certbot:
    image: certbot/certbot
    volumes:
      - ./sertbot/www:/var/www/certbot
      - ./certbot/data:/etc/letsencrypt
